add_newline = false

format = "$username$hostname$directory$cmd_duration\n$character"

[username]
show_always = true
style_user = "bold #67f4f9"
format = "[1oskrr]($style)"

[hostname]
ssh_only = false
style = "bold #ff3300"
format = "[@$hostname]($style) "

[directory]
style = "bold #9168f9"
format = "[$path]($style) "

[cmd_duration]
min_time = 1000
style = "bold #a6e39e"
format = "[took $duration]($style)"

[character]
success_symbol = "[+>>](bold #002fff)"
error_symbol = "[<<-](bold #ff0040)"
