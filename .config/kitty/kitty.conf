# font_family Google Sans Code
font_size 12

include themes/active.conf

cursor_shape block
cursor_blink_interval 1

enable_audio_bell no
confirm_os_window_close 0

window_padding_width 10 20
remember_window_size no
tab_bar_style hidden
scrollback_lines 10000

map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard
allow_remote_control yes

# Keep shell integration except for its automatic terminal titles.
shell_integration no-title


# BEGIN_KITTY_FONTS
font_family      family='Google Sans Code' variable_name=GoogleSansCode wght=550 MONO=1
bold_font        family='Google Sans Code' variable_name=GoogleSansCode wght=650 MONO=1
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS